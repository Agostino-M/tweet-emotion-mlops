[project]
name = "tweet-nlp"
version = "0.1.0"
description = "End-to-end MLOps pipeline for emotion classification on tweets (TweetEval)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
# Core deps: what is needed to preprocess text and run inference.
dependencies = [
    "emot>=3.1",
    "wordsegment>=1.3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Everything needed to download data and train models.
train = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "nltk>=3.8",
    "tqdm>=4.66",
]

[project.scripts]
tweet-nlp-data = "tweet_nlp.data:main"
tweet-nlp-train = "tweet_nlp.train:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tweet_nlp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test needs internet access (downloads models or data)",
]
